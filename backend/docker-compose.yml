services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medicheck-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    volumes:
      - .:/app
      - /app/__pycache__
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medicheck-worker
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    volumes:
      - .:/app
      - /app/__pycache__
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A workers.celery_app worker --loglevel=info
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medicheck-beat
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    volumes:
      - .:/app
      - /app/__pycache__
    depends_on:
      redis:
        condition: service_started
    command: celery -A workers.celery_app beat --loglevel=info
    restart: unless-stopped

  db:
    image: postgis/postgis:16-3.4
    container_name: medicheck-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medicheck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medicheck_secret}
      POSTGRES_DB: ${POSTGRES_DB:-medicheck}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medicheck}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: medicheck-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
