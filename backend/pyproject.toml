[project]
name = "medicheck"
version = "0.1.0"
description = "Healthcare Risk Assessment Platform"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "MediCheck Team" },
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.2.0",
    "firebase-admin>=6.5.0",
    "python-jose[cryptography]>=3.3.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "aiofiles>=24.1.0",
    "email-validator>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "watchfiles>=0.22.0",
    "python-dotenv>=1.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["fix_exposed_defects.py", "repair_test_infrastructure.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG"]
ignore = ["N805", "UP042", "SIM110"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "E501"]
"fix_exposed_defects.py" = ["E501"]
"repair_test_infrastructure.py" = ["E501"]
"workers/tasks/*" = ["ARG001"]
"app/infrastructure/seed.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
