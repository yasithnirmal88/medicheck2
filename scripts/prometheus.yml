# MediCheck Prometheus Configuration
# Used for monitoring containers and application metrics

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "medicheck-api"
    metrics_path: "/api/v1/health"
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "medicheck-api"

  - job_name: "medicheck-db"
    static_configs:
      - targets: ["db:9187"]
        labels:
          service: "medicheck-postgres"

  - job_name: "medicheck-redis"
    static_configs:
      - targets: ["redis:9121"]
        labels:
          service: "medicheck-redis"

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
