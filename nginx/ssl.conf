# SSL configuration - activate by:
#   1. Replace placeholders with real cert paths in SSL server block
#   2. Remove default.conf from sites (or comment its listen 80)
#   3. Restart nginx

# ── Production: HTTPS server ─────────────────────────────────
# Uncomment when SSL certs are available:
# server {
#     listen 443 ssl http2;
#     server_name your-domain.com;
#
#     ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
#     ssl_trusted_certificate /etc/letsencrypt/live/your-domain.com/chain.pem;
#
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
#     ssl_prefer_server_ciphers on;
#     ssl_session_cache shared:SSL:10m;
#     ssl_session_timeout 10m;
#     ssl_session_tickets off;
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
#     include /etc/nginx/conf.d/default.conf;
# }

# ── Force HTTPS redirect ─────────────────────────────────────
# Uncomment and REMOVE/rename default.conf once SSL is active:
# server {
#     listen 80;
#     server_name your-domain.com;
#     return 301 https://$server_name$request_uri;
# }
