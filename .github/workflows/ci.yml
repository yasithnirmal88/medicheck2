name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      # The backend test suite is SQLite-only: tests/conftest.py builds a
      # per-session SQLite file and never connects to these services. A Postgres
      # service here previously exported `DATABASE_URL` for the test job, which
      # made the PostgreSQL-only "audit" schema qualifiers resolve at import
      # time and emit `CREATE TABLE audit.*` on the SQLite test engine
      # (sqlite3.OperationalError "unknown database audit"). conftest now forces
      # a SQLite URL for the test process; Postgres is exercised via the
      # production Docker image, not the unit suite.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt pytest pytest-asyncio pytest-cov httpx aiosqlite

      - name: Lint with ruff
        run: |
          cd backend
          pip install ruff
          ruff check app/

      - name: Run backend tests
        run: |
          cd backend
          python -m pytest --tb=short -q --cov=app --cov-report=term-missing --cov-fail-under=50
        env:
          # SQLite: the suite's conftest always builds a SQLite engine,
          # regardless of this value (see the services comment above). Set
          # explicitly so schema qualifiers (audit schema) resolve to None.
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: development
          SECRET_KEY: test-secret-key
          ALLOW_MOCK_AUTH: "true"

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Type check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Lint
        run: |
          cd frontend
          npx eslint src/ --ext .ts,.tsx --max-warnings 0

      - name: Build
        run: |
          cd frontend
          npm run build

  docker-build:
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
