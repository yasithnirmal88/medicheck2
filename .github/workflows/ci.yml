name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-backend:
    # The suite runs in one pytest process per group (fresh SQLite DB each)
    # -- the documented, verified operating mode ("run in groups"). A single
    # process running ALL files shares one session DB and can trip cross-file
    # seed collisions that never occur group-by-group.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group:
          - "tests/test_admin_service.py tests/test_cdse_answer_activation.py tests/test_clinical_decision_service.py tests/test_cms_recovery_endpoints.py tests/test_knowledge_graph.py tests/test_report_service.py tests/test_uat.py"
          - "tests/test_interoperability_phase10.py tests/test_fhir_r4_validation.py tests/test_chw_phase8.py"
          - "tests/test_intake_phase5.py tests/test_ai_intake_phase3.py tests/test_longitudinal_phase4.py"
          - "tests/test_ai_budget.py tests/test_ai_explanation_phase1.py tests/test_ai_phase7.py tests/test_ai_providers_http.py tests/test_ai_rag_phase2.py"
          - "tests/test_audit_schema_separation.py tests/test_emergency_contact_p3.py tests/test_firebase_verify.py tests/test_identity_boundary.py tests/test_migrations.py tests/test_mock_auth_unique_email.py tests/test_population_analytics_phase6.py tests/test_production_readiness.py tests/test_profile_repository.py tests/test_profile_service_p3.py tests/test_rate_limit.py tests/test_register_role_escalation.py tests/test_user_response_roles.py"
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt pytest pytest-asyncio pytest-cov httpx aiosqlite

      - name: Lint with ruff
        run: |
          cd backend
          pip install ruff
          ruff check app/

      # Coverage stays a local check (backend: 72%); the CI gate is correctness.
      - name: Run backend tests (${{ matrix.group }})
        run: |
          cd backend
          python -m pytest --tb=short -q -W error::DeprecationWarning ${{ matrix.group }}
        env:
          # SQLite: the suite's conftest forces a SQLite engine regardless of
          # ambient env (audit-schema models must stay unqualified). Redis is
          # used by AI-budget/rate-limit services with local fallback.
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: development
          SECRET_KEY: test-secret-key
          ALLOW_MOCK_AUTH: "true"

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Type check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Lint
        run: |
          cd frontend
          npx eslint src/ --ext .ts,.tsx --max-warnings 0

      - name: Build
        run: |
          cd frontend
          npm run build

  docker-build:
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
