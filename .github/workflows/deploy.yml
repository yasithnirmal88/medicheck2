name: Deploy

# Trigger only AFTER the "CI" workflow completes. The job is skipped unless
# CI succeeded, so a failing (or cancelled) CI run can never deploy. Building
# from the specific commit CI validated (workflow_run.head_sha) keeps the
# deployed artifacts byte-for-byte the ones that passed the gate.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    # BLOCKS deployment on a failed/cancelled CI run. Skipped entirely when
    # CI did not complete successfully (conclusion is failure, cancelled, or
    # the CI run was for a different branch).
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: read
      packages: write

    steps:
      # Check out the exact commit that CI validated (workflow_run SHA), NOT
      # the default branch tip (which may have moved since).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # ─── Login to Container Registry ────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ─── Set up Buildx (required for gha cache export) ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ─── Build & Push Backend ───────────────────────────
      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/api:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/api:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ─── Build & Push Frontend ──────────────────────────
      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/frontend:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/frontend:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # ─── Deploy to Production Server ────────────────────
      - name: Deploy to Production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/medicheck
            docker compose pull
            docker compose up -d
            docker image prune -af
            echo "Deployment complete"