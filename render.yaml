# Render Blueprint — MediCheck FastAPI Backend
# Deploy via: Render Dashboard > New > Blueprint (select this repo), or `render blueprint launch`.
# Docs: https://render.com/docs/blueprint-spec
#
# NOTE: PostgreSQL and Redis are provisioned separately on Render (Dashboard > New > PostgreSQL / Redis).
# The Render service exposes DATABASE_URL and REDIS_URL env vars automatically.
# You must still set the app-specific vars below (SECRET_KEY, FIREBASE, CORS, etc.).

services:
  - type: web
    name: medicheck-api
    runtime: docker
    repo: https://github.com/yasithnirmal88/medicheck
    branch: main
    dockerfilePath: ./backend/Dockerfile
    plan: starter
    numInstances: 1
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      # --- Application security (placeholders - set real values) ---
      - key: SECRET_KEY
        sync: false
      - key: ALLOW_MOCK_AUTH
        value: "false"
      # --- CORS / Hosts (replace with your real frontend host) ---
      - key: CORS_ORIGINS
        value: https://your-frontend.onrender.com
      - key: ALLOWED_HOSTS
        value: medicheck-api.onrender.com,your-frontend.onrender.com,localhost
      # --- Firebase (set FIREBASE_CREDENTIALS_JSON to the full service-account JSON) ---
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      # --- PostgreSQL (provided automatically by Render; do not set manually) ---
      - key: DATABASE_URL
        fromDatabase:
          name: medicheck-db
          property: connectionString
      # --- Redis (provided automatically by Render; do not set manually) ---
      - key: REDIS_URL
        sync: false

# --- PostgreSQL (managed) ---
databases:
  - name: medicheck-db
    plan: starter

# --- Redis (managed) ---
# Render managed Redis is created under Dashboard > New > Redis (not in this blueprint).
# Set the REDIS_URL env var on the web service to your Redis instance's "Internal Connection String",
# but the app's settings also accept individual REDIS_HOST / REDIS_PORT / REDIS_PASSWORD.